name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm canonical source
        run: |
          test -s App.js
          echo "Building root App.js ($(wc -c < App.js) bytes)"
          grep -q "workbench_accounts" App.js
          grep -q "workbench_orders" App.js
          grep -q "store_admins" App.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript bundle
        run: npx expo export --platform android --output-dir dist-check
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK metadata
        run: |
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | head -n 3
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nanzheng-workbench-android-apk-v1.2.0
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
