name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore rebuilt Rongtong-style app source
        run: |
          base64 --decode .github/source/App.js.gz.b64 | gzip --decompress --stdout > App.js
          sed -i "s/import { supabase, supabaseConfigured } from '.\/lib\/supabase';/import { supabase } from '.\/lib\/supabase';/" App.js
          sed -i "s/supabaseConfigured?'刷新完成':'本地演示数据已刷新'/supabase?'刷新完成':'请先配置登录服务'/" App.js
          # Normalize the duplicate composite state declaration with an exact string replacement.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("App.js")
          s = p.read_text()
          old = "const [accounts,setAccounts]=useState(seedAccounts),[orders,setOrders]=useState(seedOrders),[payments,setPayments]=useState(seedPayments),[payouts,setPayouts]=useState(seedPayouts);"
          new = "const [accounts,setAccounts]=useState(seedAccounts);"
          if old not in s:
              raise SystemExit("Expected duplicate composite declaration was not found")
          p.write_text(s.replace(old, new, 1))
          PY
          test -s App.js
          echo "Restored App.js ($(wc -c < App.js) bytes)"
          echo "Checking restored source for duplicate state declarations"
          test "$(grep -o 'const \[accounts,setAccounts\]' App.js | wc -l)" -le 1

      - name: Diagnose restored JavaScript state declarations
        run: |
          echo '--- App.js lines 1-100 ---'
          nl -ba App.js | sed -n '1,100p'
          echo '--- all orders declarations/usages ---'
          grep -n 'orders\|setOrders\|seedOrders' App.js | head -n 60

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nanzheng-workbench-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
