name: Zhengnan Workbench Android APK
on:
  push:
    paths:
      - 'zhengnan-workbench/**'
      - '.github/workflows/zhengnan-workbench-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: zhengnan-workbench
        run: npm install --no-audit --no-fund
      - name: Align Expo SDK native dependencies
        working-directory: zhengnan-workbench
        run: npx expo install --fix
      - name: Validate Expo bundle
        working-directory: zhengnan-workbench
        run: npx expo export --platform android --output-dir dist-check
      - name: Generate Android project
        working-directory: zhengnan-workbench
        run: npx expo prebuild --platform android --no-install
      - name: Diagnose Expo native module metadata
        working-directory: zhengnan-workbench
        run: |
          echo '--- Expo autolinking resolved modules ---'
          npx expo-modules-autolinking resolve --platform android --json
          echo '--- Generated Android settings.gradle ---'
          nl -ba android/settings.gradle | sed -n '1,100p'
          echo '--- Expo module manifests ---'
          find node_modules -name expo-module.config.json -print
      - name: Build release APK
        working-directory: zhengnan-workbench/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK
        working-directory: zhengnan-workbench
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | head -n 3
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhengnan-workbench-android-v1.0.0
          path: zhengnan-workbench/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
